<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>Claude Code 核心概念</title>
<style>
  @font-face {
    font-family: 'Inter';
    src: url('assets/fonts/Inter-VariableFont_opsz_wght.ttf') format('truetype-variations'),
         url('assets/fonts/Inter-VariableFont_opsz_wght.ttf') format('truetype');
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Noto Sans TC';
    src: url('assets/fonts/NotoSansTC-VariableFont_wght.ttf') format('truetype-variations'),
         url('assets/fonts/NotoSansTC-VariableFont_wght.ttf') format('truetype');
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('assets/fonts/GeistMono-VariableFont_wght.ttf') format('truetype-variations'),
         url('assets/fonts/GeistMono-VariableFont_wght.ttf') format('truetype');
    font-weight: 100 900; font-style: normal; font-display: swap;
  }

  html, body { margin: 0; padding: 0; background: #090909; }
  body {
    font-family: Inter, 'Noto Sans TC', system-ui, sans-serif;
    color: #ffffff;
    /* Inter Variable character variants — Framer's body voice. */
    font-feature-settings: 'cv01', 'cv05', 'cv09', 'cv11', 'ss03', 'ss07', 'kern';
  }
  deck-stage section { overflow: hidden; }
</style>
</head>
<body>

<deck-stage width="1920" height="1080">
  <section data-label="01 Agenda"><div id="s1" style="width:100%;height:100%;"></div></section>
  <section data-label="02 Section · Foundations"><div id="s2" style="width:100%;height:100%;"></div></section>
  <section data-label="03 Token"><div id="s3" style="width:100%;height:100%;"></div></section>
  <section data-label="04 Context Window"><div id="s4" style="width:100%;height:100%;"></div></section>
  <section data-label="05 Session"><div id="s5" style="width:100%;height:100%;"></div></section>
  <section data-label="06 Section · Implementation"><div id="s6" style="width:100%;height:100%;"></div></section>
  <section data-label="07 Context Engineering"><div id="s7" style="width:100%;height:100%;"></div></section>
  <section data-label="08 CLAUDE.md"><div id="s8" style="width:100%;height:100%;"></div></section>
  <section data-label="09 Skill"><div id="s9" style="width:100%;height:100%;"></div></section>
  <section data-label="10 Overview"><div id="s10" style="width:100%;height:100%;"></div></section>
  <section data-label="11 Closing"><div id="s11" style="width:100%;height:100%;"></div></section>
</deck-stage>

<script src="deck-stage.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="slides.jsx"></script>
<script type="text/babel">
  const TOTAL = 11;
  const mount = (id, el) => ReactDOM.createRoot(document.getElementById(id)).render(el);

  mount('s1',  <Agenda n={1} total={TOTAL} />);
  mount('s2',  <SectionDivider kicker="Part 1 of 2" title="基礎認知" subtitle="Token · Context Window · Session——先搞懂 AI 怎麼「看」世界。" range="Chapters 01–03" n={2} total={TOTAL} bg="linear-gradient(135deg, #6a4cf5 0%, #d44df0 100%)" />);
  mount('s3',  <TokenCombined n={3} total={TOTAL} />);
  mount('s4',  <ContextWindowCombined n={4} total={TOTAL} />);
  mount('s5',  <SessionCombined n={5} total={TOTAL} />);
  mount('s6',  <SectionDivider kicker="Part 2 of 2" title="實作框架" subtitle="Context Engineering 方法論，加上 CLAUDE.md、Skill 兩把實作工具。" range="Chapters 04–06" n={6} total={TOTAL} bg="linear-gradient(135deg, #d44df0 0%, #ff7a3d 100%)" />);
  mount('s7',  <CECombined n={7} total={TOTAL} />);
  mount('s8',  <ClaudeMd n={8} total={TOTAL} />);
  mount('s9',  <Skill n={9} total={TOTAL} />);
  mount('s10', <Overview n={10} total={TOTAL} />);
  mount('s11', <ClosingNoLogo n={11} total={TOTAL} />);
</script>

</body>
</html>
